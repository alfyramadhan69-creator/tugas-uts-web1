<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pemesanan - BukuKu</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="checkout">
<header class="top"><a class="logo" href="dashboard.html"><img src="assets/logo.png" alt="" width="34" height="34"> BukuKu</a><nav aria-label="Navigasi utama"><a href="dashboard.html">Dashboard</a><a href="stok.html">Katalog</a><a href="checkout.html">Pemesanan</a><a href="tracking.html">Tracking</a><button id="logout" class="btn kecil" type="button">Keluar</button></nav></header>
<main>
<h1>Pemesanan Buku</h1>
<section class="kartu" aria-label="Keranjang">
<h2>Keranjang</h2>
<div class="baris">
<div><label for="pilihBuku">Buku</label><select id="pilihBuku"></select></div>
<div><label for="jumlah">Jumlah</label><input id="jumlah" type="number" min="1" value="1"></div>
</div>
<button id="btnTambah" class="btn" type="button">Tambah ke keranjang</button>
<div class="scroll"><table id="tbCart"><thead><tr><th>Judul</th><th>Harga</th><th>Jumlah</th><th>Subtotal</th><th>Aksi</th></tr></thead><tbody></tbody></table></div>
</section>
<form id="formPesan" class="kartu" novalidate>
<h2>Data pemesan dan pembayaran</h2>
<div class="baris">
<div><label for="nmPemesan">Nama pemesan</label><input id="nmPemesan" name="nama"></div>
<div><label for="emailP">Email</label><input id="emailP" name="email" type="email"></div>
<div><label for="hp">No. HP</label><input id="hp" name="hp" placeholder="08xxxxxxxxxx"></div>
<div><label for="ekspedisi">Ekspedisi</label><select id="ekspedisi" name="ekspedisi"></select></div>
<div><label for="bayar">Pembayaran</label><select id="bayar" name="bayar"><option value="">Pilih metode</option><option>Transfer Bank</option><option>E-Wallet</option><option>Bayar di Tempat (COD)</option></select></div>
</div>
<label for="alamat">Alamat pengiriman</label><textarea id="alamat" name="alamat" rows="3"></textarea>
<p>Subtotal: <b id="sub">Rp 0</b><br>Ongkir: <b id="ongkir">Rp 0</b><br>Total bayar: <span id="total" class="total">Rp 0</span></p>
<button class="btn utama" type="submit">Pesan sekarang</button>
</form>
</main>
<footer>&copy; 2026 BukuKu - Tugas UTS Pemrograman Web</footer>
<script src="js/data.js"></script>
<script src="js/script.js"></script>
</body>
</html>
