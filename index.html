<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login - BukuKu</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="login">
<main class="login">
<section class="kartu">
<img src="assets/logo.png" alt="Logo BukuKu" width="72" height="72">
<h1>Masuk ke BukuKu</h1>
<form id="formLogin" novalidate>
<label for="email">Email</label><input id="email" type="email" autocomplete="username" placeholder="alfy@mail.com">
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password" placeholder="alfy123">
<button class="btn utama" type="submit">Login</button>
</form>
<button id="btnLupa" class="btn" type="button">Lupa Password</button>
<button id="btnDaftar" class="btn" type="button">Daftar</button>
</section>
</main>
<script src="js/data.js"></script>
<script src="js/script.js"></script>
</body>
</html>
